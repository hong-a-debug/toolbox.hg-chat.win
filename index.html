<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>404</title>
  <link rel="icon" type="image/png" href="https://toolbox.hg-chat.win/icon/icon.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:#f5f6f8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
      flex-direction:column;
    }
    .error-code{
      font-size:20vw;
      font-weight:800;
      letter-spacing:-4px;
      background:linear-gradient(135deg,#1a1a2e 0%,#2a2a4e 50%,#1a1a2e 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      line-height:1;
      padding:0 20px;
    }
    .error-msg{
      margin-top:12px;
      font-size:1.2rem;
      color:#6b6b7a;
      font-weight:400;
      letter-spacing:1px;
    }
    @media(min-width:800px){
      .error-code{font-size:180px}
      .error-msg{font-size:1.4rem}
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <div class="error-msg">内容已被删除</div>
</body>
</html>
